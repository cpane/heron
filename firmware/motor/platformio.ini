; The motor controller firmware. Built in a container by
; scripts/build_firmware.sh, never on the host; see docs/motor-design.md §3.
;
; Everything that decides what gets compiled is pinned here, so a fresh
; clone builds the same firmware: the board platform, the Arduino core and
; the compiler (avr-gcc 7.3.0). PlatformIO itself is pinned in
; docker/Dockerfile.firmware.
;
; One environment per platform (docs/motor-design.md §6). Each sets the
; platform ID that Boot reports, so the Pi can tell what it is talking to.

[platformio]
; Outside firmware/, in the git-ignored build-firmware/ beside build-pi/.
build_dir = ../../build-firmware/motor
default_envs = bench

[common]
platform = platformio/atmelavr@5.3.0
platform_packages =
    platformio/framework-arduino-avr@5.4.0
    platformio/toolchain-atmelavr@1.70300.191015
framework = arduino
; C++17 for the shared protocol headers (inline variables); the Arduino
; default is gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I${PROJECT_DIR}/../../protocol/motor/include
    -DHERON_FW_MAJOR=0
    -DHERON_FW_MINOR=2
    -DHERON_FW_PATCH=0
; Warnings for our code in src/ only: the Arduino core does not build clean
; with them. The logic in lib/ gets the full Pi-side warning set when CMake
; compiles it for the host tests.
build_src_flags = -Wall -Wextra

[env:bench]
; Keyestudio Uno R3-compatible, ATmega328P, with the L293D shield.
platform = ${common.platform}
platform_packages = ${common.platform_packages}
framework = ${common.framework}
board = uno
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DHERON_PLATFORM=1
build_src_flags = ${common.build_src_flags}
