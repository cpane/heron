# Mini robot 2, for the Maker Faire (2026-11-21/22): the same parts as the
# bench rig (mini robot 1), a Keyestudio Uno with the HW-130 L293D shield
# and four yellow DC motors on mecanum wheels, with its own Pi (a 3B+).
#
# COPIED from profiles/bench.conf on 2026-11-20, not measured on this
# robot: the identical parts make the bench rig's numbers the best start.
# [motor] terminal and sign are checked first, with builder/wheel_check.sh,
# before it drives; the rest are spot-checked on the floor. Each
# .calibration section still describes the bench rig's measurement.
#
# Checked on this robot, 2026-11-20 and -21: builder/wheel_check.sh passed
# (terminal and sign as copied), and Manual drives forward at 0.43 m/s.
# Its mecanum wheels were first mounted in an O, so strafing spun it
# (docs/wiring.md, build step 7); the motion table and [geometry] are to
# be spot-checked again once they are in an X.
#
# The format and the rules are in docs/rig-profiles.md; how to measure each
# value is in that document's "Calibrating a rig". Check a change with:
#   build-host/bin/rig_profile check profiles/mini-2.conf
format = 1

[rig]
name = mini-2
platform = uno-l293d
# The drive: the Uno and L293D shield, the yellow TT motors, its mecanum
# wheels and weight. Its known surfaces are profiles/surfaces/bench-mecanum/.
drive = bench-mecanum
# The floor heron_robot assumes unless told --surface (design §19, P18).
# The surface's numbers override [geometry]'s and [odometry]'s.
surface = hardwood-1

[motor]
# Per protocol motor 1..4 (front-left, front-right, back-right, back-left):
# the shield terminal (1..4 for M1..M4) and the sign. The back pair is wired
# M3 back-left, M4 back-right, the reverse of the protocol's order.
terminal = 1 2 4 3
sign = + + + +
ramp_per_ms = 4
# PWM duty where each motor first turned steadily from rest, plus 10.
# Measured 2026-11-11, wheels on, lifted: forward 61 71 97 97,
# backward 71 92 87 92. Motor 3 backward did not turn from rest at 97,
# nor once at 107, in the check (drive -1 -1 -1 -1), so it has +20; at 107
# it then turned every time, from cold included.
# Measured 2026-10-25, no wheels, before the rewiring: forward 66 71 77 82,
# backward 61 66 66 92.
min_duty_forward = 71 81 107 107
min_duty_backward = 81 102 107 102

[motor.calibration]
date = 2026-11-11
method = motor_link sweep, step 20, 1 s per value, from rest; +10 margin on each
supply = the motor battery on EXT_PWR, PWR jumper off
wheels = mecanum wheels on, lifted on the block; not under the robot's weight
dead_band_2026_10_25 = no wheels, AA cells on EXT_PWR; forward 66 71 77 82, backward 61 66 66 92
terminal_and_sign = each motor driven alone at 600, wheel and direction watched
ramp = 0 to 1000 in about 250 ms, smooth, no reset

[geometry]
# The outline, wheels included, centred on the wheelbase centre, and how
# fast the robot goes at full command, throttle at the top. Shared: the
# mixing's wheel keys join it when the mixing needs them.
length = 0.1905
width = 0.1905
max_speed = 0.42
# The least it moves at: the motors' dead band lifts every command above
# zero to this (heron_robot's RobotCore.h, "Units").
min_speed = 0.16
max_turn_rate = 3.4
# Not measured: the design's starting value, to be tuned (rig-calibration.md §8.7).
accel = 0.6
brake = 0.7

[geometry.calibration]
date = 2026-11-14
floor = hardwood; the power block through its PD trigger and buck
length_width = tape, 2026-11-11, wheels included; the outline centred on the wheelbase centre
max_speed = heron_teleop, throttle and stick full forward, 1 m run-up, 2 m timed by stopwatch, front edge to front edge: 4.98 4.73 4.63 s, 0.402 0.423 0.432 m/s, mean 0.42
max_turn_rate = otos_spin, throttle and turn stick full, about 5 turns in one go, 4 trials: fastest 200 197 198 200 deg/s, times 0.991 (the angular scalar): 196 deg/s, 3.42 rad/s, rounded down
min_speed = heron_robot --lines 10, Manual, the OTOS's speed held for 2 s, 2026-11-14: out 0.20 0.39 0.59 gave 0.19 0.26 0.30 m/s; speed = 0.42 x (0.38 + 0.62 x out) fits within 0.02, so 0.42 x 0.38 = 0.16
brake = the motors coast at zero, so it is the coasting rate: the OTOS's speed falling after the stick was let go, 2026-11-14, 0.6 to 0.8 m/s^2; and the overshoot past the stop line in two Assisted runs at a box, 5 mm from 0.08 m/s and 45 mm from 0.25 m/s, both 0.7. First 2.2 (2026-11-14), from the shortest of 3 disarmed stops at full speed, 40 80 110 mm: too high, the limiter stopped late
accel = design §10's starting value, not measured

[lidar]
# The RPLIDAR A1M8's mounting, from the wheelbase centre: x forward, y left.
# Its housing front faces the robot's back, so the whole scan turns 180.
x = -0.008
y = 0
yaw_deg = 180
height = 0.27

[lidar.calibration]
date = 2026-11-11
x_y_height = tape from the wheelbase centre (midway between the hubs) to the spin axis, and floor to the scan plane, robot on its wheels; about 5 mm
yaw_deg = lidar_nearest --arc 60 sectors, box about 1 m away: robot's front read +177 and -177 (LiDAR's own front sector empty), robot's left read -91; yaw 177 to 183, rounded to 180
note = the first left check with --arc 360 read +89: the nearest thing in any direction, not the box

[odometry]
# The SparkFun OTOS's mounting, from the wheelbase centre, and its scalars
# (true / reported). Its axes match the robot's: forward +x, left +y.
# The linear scalar holds for the hardwood floor only: carpet read 27% short.
x = 0
y = 0
yaw_deg = 0
linear_scalar = 0.908
angular_scalar = 0.991

[odometry.calibration]
date = 2026-11-13
x_y = tape from the wheelbase centre to the sensor's centre, 2026-11-11; about 5 mm
yaw_deg = odometry_adapter, pushed by hand 2026-11-11: forward read +x, left +y, a left turn raised the heading; not mirrored
floor = hardwood; sensor 14 to 15 mm above it
linear_scalar = otos_move 2026-11-11, five 1000 mm pushes along a straight edge, forward each time: reported 1087.4 1108.1 1104.6 1108.6 1100.2, mean +10.2%, sd 8.7 mm; 1 / 1.102
linear_note = carpet read about 27% short with no warning, a board over it read right; the odometry workstream's sled read +0.2% on its wood floor
angular_scalar = otos_spin 2026-11-13, spun by heron_teleop, 5 turns out and 5 back, 3 trials squared up by hand at the turnaround: legs +1.00 +0.68 +0.64 +0.86 +1.04 +1.14%, mean +0.89%, sd 0.20%; 1 / 1.0089
angular_note = all 20 driven legs that day read long, mean +0.98%; the odometry workstream's hand-spun sled read -0.20%

[navigation]
# Margins round the outline. Starting values from the design, to be tuned
# in the simulator and on the floor (rig-calibration.md §8.7).
# stop_margin must stay at least 0.04, or the LiDAR's blind circle
# (126.8 mm round it) reaches past the stop outline.
stop_margin = 0.05
slow_margin = 0.25

[navigation.calibration]
date = 2026-11-14
margins = navigation-design.md §10's starting values, not measured
blind_spot = 126.8 mm round the LiDAR at x -0.008 reaches 134.8 mm behind the centre, inside 95.25 + 50 = 145.25 mm; checkBlindSpot() 2026-11-14: fits at stop_margin 0.040, fails at 0.035
