# The bench rig: a Keyestudio Uno with the HW-130 L293D shield and four
# yellow DC motors on mecanum wheels; a small robot since 2026-11-03,
# driven on the floor or on a block. Its own Pi. The duties below were
# measured with its mecanum wheels on, lifted (2026-11-11); first measured
# with no wheels (2026-10-25).
#
# The format and the rules are in docs/rig-profiles.md; how to measure each
# value is in that document's "Calibrating a rig". Check a change with:
#   build-host/bin/rig_profile check profiles/bench.conf
format = 1

[rig]
name = bench
platform = uno-l293d

[motor]
# Per protocol motor 1..4 (front-left, front-right, back-right, back-left):
# the shield terminal (1..4 for M1..M4) and the sign. The back pair is wired
# M3 back-left, M4 back-right, the reverse of the protocol's order.
terminal = 1 2 4 3
sign = + + + +
ramp_per_ms = 4
# PWM duty where each motor first turned steadily from rest, plus 10.
# Measured 2026-11-11, wheels on, lifted: forward 61 71 97 97,
# backward 71 92 87 92. Motor 3 backward did not turn from rest at 97,
# nor once at 107, in the check (drive -1 -1 -1 -1), so it has +20; at 107
# it then turned every time, from cold included.
# Measured 2026-10-25, no wheels, before the rewiring: forward 66 71 77 82,
# backward 61 66 66 92.
min_duty_forward = 71 81 107 107
min_duty_backward = 81 102 107 102

[motor.calibration]
date = 2026-11-11
method = motor_link sweep, step 20, 1 s per value, from rest; +10 margin on each
supply = the motor battery on EXT_PWR, PWR jumper off
wheels = mecanum wheels on, lifted on the block; not under the robot's weight
dead_band_2026_10_25 = no wheels, AA cells on EXT_PWR; forward 66 71 77 82, backward 61 66 66 92
terminal_and_sign = each motor driven alone at 600, wheel and direction watched
ramp = 0 to 1000 in about 250 ms, smooth, no reset

[lidar]
# The RPLIDAR A1M8's mounting, from the wheelbase centre: x forward, y left.
# Its housing front faces the robot's back, so the whole scan turns 180.
x = -0.008
y = 0
yaw_deg = 180
height = 0.27

[lidar.calibration]
date = 2026-11-11
x_y_height = tape from the wheelbase centre (midway between the hubs) to the spin axis, and floor to the scan plane, robot on its wheels; about 5 mm
yaw_deg = lidar_nearest --arc 60 sectors, box about 1 m away: robot's front read +177 and -177 (LiDAR's own front sector empty), robot's left read -91; yaw 177 to 183, rounded to 180
note = the first left check with --arc 360 read +89: the nearest thing in any direction, not the box
