# The Maker Faire's rubber field-house floor, 2026-11-21 and -22.
# NOT MEASURED YET: every number below is hardwood-1's (2026-11-18),
# copied so the robot can be switched to this floor and driven while it is
# measured. On the day, in docs/navigation-faire-checklist.md's order,
# each line is replaced by what the rubber does, and the calibration
# record says which. Until then this is the hardwood on a rubber floor,
# and nothing here is to be trusted for it.
#
# A known surface (navigation design §19, P18): the numbers that depend on
# the floor, for one drive. The format and rules are in docs/rig-profiles.md
# and RigProfile.h; how to measure one, docs/rig-calibration.md §8.8.
# The motion table: p<n> = <direction deg> <size> <vx m/s> <vy m/s> <wz rad/s>,
# robot frame; direction counterclockwise from forward, so right is -90.
format = 1

